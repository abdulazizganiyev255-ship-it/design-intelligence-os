<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Hisobchi AI — S03 monochrome wireframes</title>
<style>
  :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202020;background:#fff;font-synthesis:none}
  *{box-sizing:border-box} html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
  body{font-size:14px} .device{display:flex;flex-direction:column;height:100dvh;width:100%;background:#fff;overflow:hidden}
  .top{padding:18px 20px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;flex:0 0 auto;min-height:63px}
  .brand{font-size:20px;font-weight:730;letter-spacing:-.7px}.pill{font-size:11px;border:1px solid #969696;color:#383838;border-radius:5px;padding:5px 7px;letter-spacing:.4px;font-weight:700}
  .scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding:17px 20px 28px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
  .eyebrow{color:#666;font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;margin:0 0 9px}
  .h1{font-weight:740;font-size:23px;line-height:1.18;margin:3px 0 15px;letter-spacing:-.7px}.h2{font-size:16px;font-weight:720;letter-spacing:-.35px;margin:0}
  .muted{color:#626262;font-size:12px;line-height:1.4}.tiny{font-size:11px;color:#696969;line-height:1.35}
  .primary{border-radius:8px;background:#2d2d2d;color:white;min-height:53px;padding:13px 15px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:690;width:100%;white-space:normal;text-align:center}
  .section{margin:24px 0 0}.sep{height:1px;background:#d8d8d8;margin:16px 0}
  .summary{border:1px solid #bfbfbf;border-radius:8px;padding:15px 15px 12px;margin:19px 0 0}
  .total{font-size:28px;line-height:1.12;letter-spacing:-.8px;font-weight:750;white-space:normal;overflow-wrap:anywhere;margin:6px 0 8px}
  .keyrow,.item,.nav,.labels,.inline{display:flex;align-items:center;justify-content:space-between;gap:9px}
  .keyrow{min-height:31px;font-size:13px}.keyrow b{font-weight:680;font-variant-numeric:tabular-nums;text-align:right}
  .item{min-height:50px;border-bottom:1px solid #e4e4e4;font-size:13px}.item .detail{display:flex;flex-direction:column;gap:4px;min-width:0}.item strong{font-size:13px;font-weight:660}.item b{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
  .nav{border-top:1px solid #bcbcbc;height:66px;flex:0 0 66px;padding:8px 12px;background:#fafafa;gap:1px}.nav span{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#5e5e5e;white-space:nowrap}.nav .active{color:#111;font-weight:800;border-bottom:2px solid #333}
  .back{font-size:13px;font-weight:650;margin:0}.fieldlabel{font-size:14px;font-weight:700;margin:18px 0 8px}.input{border:1.5px solid #989898;border-radius:7px;padding:15px 13px;min-height:53px;background:#fff;color:#262626;font-size:16px;font-weight:680;display:flex;align-items:center;justify-content:space-between}
  .input.invalid{border:2px solid #555;background:#f5f5f5}.error{font-size:12px;font-weight:700;color:#333;background:#eee;border-left:3px solid #555;padding:8px 10px;margin-top:8px;line-height:1.4}
  .choice{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;min-height:35px;border:1px solid #a4a4a4;background:#fff;padding:7px 11px;border-radius:6px;font-size:12px;font-weight:580;max-width:100%;white-space:normal}.chip.on{background:#e1e1e1;border-color:#424242;font-weight:750}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.control{border:1px solid #999;border-radius:7px;padding:11px 12px;min-height:41px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:620}
  .footer-note{font-size:11px;line-height:1.4;color:#6d6d6d;margin:15px 0 3px}.fieldhint{font-size:11px;line-height:1.4;color:#6b6b6b;margin:8px 0 0}
  .toolbar{display:flex;gap:7px}.search{border:1px solid #ababab;border-radius:7px;padding:12px;font-size:13px;color:#666;min-width:0;flex:1}.filter{border:1px solid #ababab;border-radius:7px;padding:12px 9px;font-size:12px;font-weight:640;min-width:74px;text-align:center}
  .fieldnote{margin-top:12px;font-size:12px;line-height:1.5;color:#555}.inlinebetween{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabset{display:flex;align-items:center;gap:5px;margin:12px 0 16px}.tabset span{border:1px solid #aaa;padding:8px 10px;font-size:12px;border-radius:6px;flex:1;text-align:center}.tabset span.selected{background:#dedede;color:#222;border-color:#333;font-weight:700}
  .status{font-size:11px;padding:8px 10px;border:1px dashed #aaa;border-radius:6px;margin:10px 0 0;color:#626262}
  .chart-placeholder{border:1.5px dashed #aaa;height:132px;border-radius:8px;margin-top:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:9px;color:#696969;padding:14px;font-size:12px}
  .skeleton{height:5px;background:#dedede;width:75%;border-radius:2px}.empty{padding:30px 14px;border:1.5px dashed #aaa;text-align:center;border-radius:9px;margin-top:17px}.empty strong{display:block;font-size:15px;margin-bottom:9px}.empty p{font-size:12px;color:#555;line-height:1.4}.secondary{border:1px solid #929292;border-radius:7px;padding:12px 15px;display:inline-block;font-size:13px;font-weight:680;margin:8px 0}
  .track{border:1px solid #bbb;padding:13px;border-radius:7px;margin:12px 0 0;font-size:12px;line-height:1.5;color:#555}
  @media(max-width:339px){.top{padding:13px 15px 9px;min-height:53px}.scroll{padding:13px 15px 22px}.brand{font-size:18px}.h1{font-size:21px}.section{margin-top:18px}.summary{padding:12px;margin-top:13px}.total{font-size:25px}.primary{min-height:49px;padding:11px}.item{min-height:44px}.item b{font-size:12px}.item strong{font-size:12px}.nav{height:59px;flex-basis:59px;padding:5px 6px}.nav span{font-size:12px;padding:8px 0}.fieldlabel{margin:13px 0 6px}.input{min-height:45px;padding:10px 11px}.chip{min-height:31px;padding:6px 9px;font-size:11px}.tabset{margin:8px 0 12px}.tabset span{padding:7px}.eyebrow{font-size:10px}.toolbar .search{padding:10px}.toolbar .filter{padding:10px 7px}.keyrow{font-size:12px}}
</style>
</head><body><main class="device" id="app"></main>
<script>
const params=new URLSearchParams(location.search);const screen=params.get('screen')||'home';const state=params.get('state')||'default';
const nav=(tab)=>`<nav class="nav" aria-label="Faqat wireframe navigatsiyasi"><span class="${tab==='home'?'active':''}">Bosh</span><span class="${tab==='history'?'active':''}">Tarix</span><span class="${tab==='analytics'?'active':''}">Tahlil</span><span>Profil</span></nav>`;
const header=(t)=>`<header class="top"><span class="brand">${t}</span><span class="pill">DEMO</span></header>`;
const row=(n,v,d='')=>`<div class="item"><span class="detail"><strong>${n}</strong>${d?`<small class="muted">${d}</small>`:''}</span><b>${v}</b></div>`;
const home=()=>`${header('Hisobchi')}<section class="scroll"><div class="eyebrow">Xarajat nazorati</div><h1 class="h1">Xarajatlaringizni kuzating</h1><div class="primary" data-primary>＋ &nbsp;Xarajat qo‘shish</div><section class="summary"><div class="eyebrow">Sessiya yakuni</div><div class="muted">Sof farq — bank balansi emas</div><div class="total">2 741 000 so‘m</div><div class="keyrow"><span>Kirim</span><b>3 000 000 so‘m</b></div><div class="keyrow"><span>Chiqim</span><b>259 000 so‘m</b></div><div class="status">Faqat joriy demo sessiya yozuvlaridan</div></section><section class="section"><div class="inlinebetween"><h2 class="h2">So‘nggi operatsiyalar</h2><span class="muted">Barchasi</span></div>${row('Oziq-ovqat','−85 000 so‘m','22-noyabr')}${row('Transport','−12 000 so‘m','22-noyabr')}${row('Kafe','−42 000 so‘m','21-noyabr')}</section><p class="footer-note">Raqamlar namuna sessiyadan; bank ma’lumotlari ulanmagan.</p></section>${nav('home')}`;
const editor=()=>`${header('‹ &nbsp;Yangi operatsiya')}<section class="scroll"><div class="eyebrow">Demo · sessiyada saqlanadi</div><div class="tabset"><span class="selected">Xarajat</span><span>Daromad</span></div><div class="fieldlabel">Summa</div><div class="input ${state==='error'?'invalid':''}"><span>${state==='error'?'0':'100 000'}</span><span>so‘m</span></div>${state==='error'?`<div class="error">1 dan 999 999 999 999 so‘mgacha butun summa kiriting.</div>`:`<div class="fieldhint">Faqat musbat butun summa</div>`}<div class="fieldlabel">Kategoriya</div><div class="choice"><span class="chip on">Oziq-ovqat</span><span class="chip">Transport</span><span class="chip">Kafe</span><span class="chip">Salomatlik</span><span class="chip">Boshqa xarajat</span></div><div class="fieldlabel">Sana</div><div class="control">23.11.2026 <span>⌄</span></div><div class="fieldlabel">Izoh (ixtiyoriy)</div><div class="input" style="font-weight:400;color:#777;font-size:13px">Masalan: do‘kondan xarid</div><div style="height:14px"></div><div class="primary" data-primary>Operatsiyani qo‘shish</div><p class="footer-note">Ortga qaytish: kirilgan oynaga. Bekor qilish hech narsani saqlamaydi.</p><div class="status">Ilova sessiyasidan tashqariga sinxronlanmaydi.</div></section>`;
const history=()=>`${header('Operatsiyalar')}<section class="scroll"><div class="muted">Kirim va chiqimlar · demo sessiya</div><div style="height:12px"></div><div class="primary" data-primary>＋ &nbsp;Xarajat qo‘shish</div><div style="height:15px"></div><div class="toolbar"><div class="search">⌕ &nbsp; Qidirish...</div><div class="filter">Muddat ⌄</div></div><div class="tabset"><span class="selected">Barchasi</span><span>Xarajat</span><span>Daromad</span></div>${state==='empty'?`<div class="muted">Filtr bo‘yicha: 0 ta yozuv</div><div class="empty"><strong>Mos operatsiya topilmadi</strong><p>Qidiruv yoki davr filtrini o‘zgartiring.</p><div class="secondary">Filtrlarni tozalash</div></div>`:`<div class="inlinebetween"><b style="font-size:13px">5 ta operatsiya</b><span class="tiny">Barchasi · demo</span></div><div class="sep" style="margin:10px 0 4px"></div><div class="eyebrow" style="margin:14px 0 4px">22-noyabr</div>${row('Oziq-ovqat','−85 000 so‘m')}${row('Transport','−12 000 so‘m')}<div class="eyebrow" style="margin:18px 0 4px">21-noyabr</div>${row('Kafe','−42 000 so‘m')}<div class="eyebrow" style="margin:18px 0 4px">20-noyabr</div>${row('Ish haqi','+3 000 000 so‘m')}<div class="eyebrow" style="margin:18px 0 4px">19-noyabr</div>${row('Salomatlik','−120 000 so‘m')}<section class="summary"><div class="eyebrow">Ko‘rinayotgan yozuvlar jami</div><div class="keyrow"><span>Kirim</span><b>3 000 000 so‘m</b></div><div class="keyrow"><span>Chiqim</span><b>259 000 so‘m</b></div></section>`}<p class="footer-note">Natijalar joriy sessiya asosida. Filtrlangan ro‘yxat va jami bir xil qamrovga ega.</p></section>${nav('history')}`;
const analytics=()=>`${header('Tahlil')}<section class="scroll"><div class="inlinebetween"><div class="eyebrow" style="margin:0">Sessiya hisoboti</div><div class="control" style="min-height:35px">Barchasi ⌄</div></div>${state==='empty'?`<div class="empty"><strong>Ushbu davrda yozuv yo‘q</strong><p>Grafik yoki foiz taxmin qilinmaydi. Davrni o‘zgartiring yoki xarajat kiriting.</p><div class="secondary">Operatsiyalarni ko‘rish</div></div>`:`<section class="summary"><div class="keyrow"><span>Chiqim</span><b>259 000 so‘m</b></div><div class="keyrow"><span>Kirim</span><b>3 000 000 so‘m</b></div><div class="sep" style="margin:10px 0"></div><div class="muted">Sof farq — hisob balansi emas</div><div class="total">2 741 000 so‘m</div><div class="status">Barcha namuna sessiya yozuvlaridan</div></section><section class="section"><h2 class="h2">Sana bo‘yicha xarajatlar</h2><p class="fieldnote">Grafik faqat qayd etilgan sanalarga asoslanadi. Davr natijalari va grafik qamrovi farq qilishi mumkin.</p><div class="chart-placeholder"><div class="eyebrow" style="margin:0;color:#666">S03 joylashuv uchun grafik maydoni</div><div class="skeleton"></div><div class="skeleton" style="width:54%"></div><div class="tiny">Haqiqiy diagramma S07/S09 da</div></div></section><div style="height:17px"></div><div class="secondary">Operatsiyalarni ko‘rish</div>`}<p class="footer-note">Safe-to-Spend real hisoblanmagan. Bu demo tahlil, bank hisobi emas.</p></section>${nav('analytics')}`;
const views={home,editor,history,analytics};document.getElementById('app').innerHTML=(views[screen]||home)();document.body.dataset.screen=screen;document.body.dataset.state=state;
</script>
</body></html>
