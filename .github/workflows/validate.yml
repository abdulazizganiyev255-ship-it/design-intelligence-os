name: Validate Foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Structural QA (no API keys)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required files, skills, and score gates
        run: python3 tools/validate_foundation.py
