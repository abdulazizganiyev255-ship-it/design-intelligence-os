name: Validate Hisobchi Strategy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy:
    name: Foundation + Board + Sequential OS + Hisobchi S03
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Foundation structure
        run: python3 tools/validate_foundation.py
      - name: Simulated Board structure
        run: python3 tools/validate_board_session.py
      - name: Sequential Design OS structure
        run: python3 tools/validate_operating_system.py
      - name: Hisobchi S00/S01 approvals, S02 spec gate, S03 drafts and finance checks
        run: python3 tools/validate_hisobchi_strategy.py
      - name: S03 rendered wireframe manifest and source integrity
        run: python3 tools/validate_s03_render_manifest.py
